name: Nightly

on:
  schedule:
    # 00:00 KST (GitHub cron uses UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional dev commit SHA; it must belong to dev
        required: false
        type: string
      version:
        description: Optional x.y.z base version; defaults to package.json
        required: false
        type: string
      release_state:
        description: Manual runs create a Draft by default; choose Published to update users immediately
        required: true
        default: draft
        type: choice
        options:
          - draft
          - published
      force:
        description: Publish even when this source commit already has a Nightly
        required: false
        default: false
        type: boolean

jobs:
  publish:
    uses: ./.github/workflows/publish-development-channel.yaml
    with:
      channel: nightly
      source_branch: dev
      source_sha: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || '' }}
      base_version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
      use_kst_cutoff: ${{ github.event_name == 'schedule' }}
      force: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}
      draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_state == 'draft' }}
    secrets: inherit
