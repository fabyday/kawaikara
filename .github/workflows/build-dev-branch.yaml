name: Validate development channels

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache pinned video-effect assets
        uses: actions/cache@v4
        with:
          path: .cache/video-effects
          key: video-effects-v1-${{ runner.os }}-${{ hashFiles('scripts/video-effects-assets.lock.json') }}
      - run: pnpm typecheck
      - name: Video interaction regression tests
        run: node --test tests/Unit/video-seek.test.cjs tests/Integration/video-drop.test.cjs tests/Integration/provider-plugin-settings.test.cjs tests/Integration/video-effects.test.cjs
      - run: pnpm build
        env:
          KAWAIKARA_BUILD_CHANNEL: nightly
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      - run: pnpm storybook:build
