name: Validate development channels

on:
  push:
    branches:
      - dev3
      - staging
  pull_request:
    branches:
      - dev3
      - staging

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          KAWAIKARA_BUILD_CHANNEL: ${{ (github.base_ref == 'staging' || github.ref_name == 'staging') && 'staging' || 'nightly' }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      - run: pnpm storybook:build
