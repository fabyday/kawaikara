name: Publish Stable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate package credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in CODE_SIGN_CERT DISCORD_CLIENT_ID WIDEVINE_ACCOUNT WIDEVINE_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Required ${variable} credential is missing for the Stable ${PLATFORM} package."
              exit 1
            fi
          done
        env:
          PLATFORM: ${{ matrix.platform }}
          CODE_SIGN_CERT: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC || secrets.SELF_SIGNED_CERT }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_APP_ID }}
          WIDEVINE_ACCOUNT: ${{ secrets.ACCOUNT }}
          WIDEVINE_PASSWORD: ${{ secrets.PASSWD }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Widevine signing client
        run: python -m pip install castlabs-evs==1.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Authenticate Widevine signing
        run: pnpm widevine:auth
        env:
          KAWAIKARA_EVS_ACCOUNT: ${{ secrets.ACCOUNT }}
          KAWAIKARA_EVS_PASSWORD: ${{ secrets.PASSWD }}
      - name: Publish tagged Stable release
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm release:stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC || secrets.SELF_SIGNED_CERT }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC_PASSWD || '' }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          KAWAIKARA_EVS_NONINTERACTIVE: '1'
      - name: Publish Stable release
        if: github.event_name == 'workflow_dispatch'
        run: pnpm release:stable
        env:
          KAWAIKARA_RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC || secrets.SELF_SIGNED_CERT }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC_PASSWD || '' }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          KAWAIKARA_EVS_NONINTERACTIVE: '1'
      - name: Publish built-in Provider Bundle
        if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_version="${release_tag#v}"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            release_version="$REQUESTED_VERSION"
            release_tag="v${release_version}"
          else
            release_version="$(node -p "require('./package.json').version")"
            release_tag="v${release_version}"
          fi
          pnpm package:built-in-bundle -- \
            "builds/stable/kawaikara.builtin-sites.kawai"
          gh release upload "$release_tag" \
            "builds/stable/kawaikara.builtin-sites.kawai" --clobber
