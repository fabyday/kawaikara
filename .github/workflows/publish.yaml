name: Publish Kawaikara channel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - stable
          - staging
          - nightly
      version:
        description: SemVer without the v prefix (optional)
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Widevine signing client
        run: python -m pip install castlabs-evs==1.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Authenticate Widevine signing
        run: pnpm widevine:auth
        env:
          KAWAIKARA_EVS_ACCOUNT: ${{ secrets.ACCOUNT }}
          KAWAIKARA_EVS_PASSWORD: ${{ secrets.PASSWD }}
      - name: Publish tagged channel
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm release:auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC || secrets.SELF_SIGNED_CERT }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC_PASSWD || '' }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          KAWAIKARA_EVS_NONINTERACTIVE: '1'
      - name: Publish selected channel
        if: github.event_name == 'workflow_dispatch'
        run: pnpm run release:${{ inputs.channel }}
        env:
          KAWAIKARA_RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC || secrets.SELF_SIGNED_CERT }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.SELF_SIGNED_CERT_FOR_MAC_PASSWD || '' }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          KAWAIKARA_EVS_NONINTERACTIVE: '1'
