name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    warm-up-cache-win:
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.21.1'
            
            - name: Enable Corepack
              run: corepack enable

            - run: yarn install --immutable

    warm-up-cache-mac:
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.21.1'
            - name: Enable Corepack
              run: corepack enable

            - run: yarn install --immutable

    # GENERAL electron packaging
    electron-package-mac:
        needs: [warm-up-cache-mac]
        runs-on: macos-14
        steps:
            - name: Checkout
              uses: actions/checkout@v4 # v4 is the latest version as of June 2024

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.21.1'
            
            - name: Enable Corepack
              run: corepack enable

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'
                  cache: 'pip'

            - name: Install Python dependencies
              run: pip install -r requirements.txt

            - name: Install JS dependencies
              # cache: 'yarn' in setup-node should handle caching, so we can directly install here
              run: yarn install --immutable

            - name: Test (reauth)
              run: sh ./scripts/reauth.sh
              env:
                  ACCOUNT: ${{ secrets.ACCOUNT }}
                  PASSWORD: ${{ secrets.PASSWD }}

            - name: Build electron package
              run: yarn release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CSC_LINK: ${{ secrets.SELF_SIGNED_CERT_FOR_MAC }}
                  CSC_KEY_PASSWORD: ${{ secrets.SELF_SIGNED_CERT_FOR_MAC_PASSWD }}
                  DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
                  DISCORD_PUB_KEY: ${{ secrets.DISCORD_PUB_KEY }}

    # GENERAL electron packaging
    electron-package-win:
        needs: [warm-up-cache-win]
        runs-on: windows-2022
        steps:
            - name: Checkout
              uses: actions/checkout@v4 # v4 is the latest version as of June 2024
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.21.1'

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'
                  cache: 'pip'
            - name: Install Python dependencies
              run: pip install -r requirements.txt

            - name: Install JS dependencies

              # cache: 'yarn' in setup-node should handle caching, so we can directly install here
              run: yarn install --immutable

            - name: Test (reauth)
              # powersell script for windows
              run: powershell.exe ./scripts/reauth.ps1
              env:
                  ACCOUNT: ${{ secrets.ACCOUNT }}
                  PASSWORD: ${{ secrets.PASSWD }}

            - name: Repackage Windows signing certificate
              shell: pwsh
              env:
                  WINDOWS_CERTIFICATE: ${{ secrets.SELF_SIGNED_CERT }}
              run: |
                  $ErrorActionPreference = 'Stop'

                  $sourcePfx = Join-Path $env:RUNNER_TEMP 'kawaikara-source.p12'
                  $pemBundle = Join-Path $env:RUNNER_TEMP 'kawaikara-signing.pem'
                  $repackedPfx = Join-Path $env:RUNNER_TEMP 'kawaikara-signing.p12'

                  $certificateBase64 = $env:WINDOWS_CERTIFICATE.Trim()
                  $dataUrlMarker = 'base64,'
                  $dataUrlIndex = $certificateBase64.IndexOf($dataUrlMarker)
                  if ($dataUrlIndex -ge 0) {
                      $certificateBase64 = $certificateBase64.Substring($dataUrlIndex + $dataUrlMarker.Length)
                  }

                  try {
                      $certificateBytes = [Convert]::FromBase64String($certificateBase64)
                  } catch {
                      throw 'SELF_SIGNED_CERT is not a valid base64-encoded PKCS#12 file.'
                  }
                  if ($certificateBytes.Length -eq 0) {
                      throw 'SELF_SIGNED_CERT decoded to an empty file.'
                  }
                  [IO.File]::WriteAllBytes($sourcePfx, $certificateBytes)

                  $openSslCommand = Get-Command openssl -ErrorAction SilentlyContinue
                  if ($null -ne $openSslCommand) {
                      $openSsl = $openSslCommand.Source
                  } else {
                      $openSsl = 'C:\Program Files\Git\usr\bin\openssl.exe'
                      if (-not (Test-Path -LiteralPath $openSsl -PathType Leaf)) {
                          throw 'OpenSSL was not found on the Windows runner.'
                      }
                  }

                  & $openSsl pkcs12 -in $sourcePfx -passin 'pass:' -nodes -out $pemBundle
                  if ($LASTEXITCODE -ne 0) {
                      throw 'OpenSSL could not open SELF_SIGNED_CERT with an empty password.'
                  }

                  & $openSsl pkey -in $pemBundle -noout
                  if ($LASTEXITCODE -ne 0) {
                      throw 'SELF_SIGNED_CERT does not contain an accessible private key.'
                  }

                  $passwordBytes = [byte[]]::new(32)
                  [Security.Cryptography.RandomNumberGenerator]::Fill($passwordBytes)
                  $repackedPassword = [Convert]::ToBase64String($passwordBytes)
                  Write-Output "::add-mask::$repackedPassword"

                  & $openSsl pkcs12 -export -in $pemBundle -out $repackedPfx -passout "pass:$repackedPassword" -name 'fabyday'
                  if ($LASTEXITCODE -ne 0) {
                      throw 'Failed to repackage the Windows signing certificate.'
                  }

                  "WIN_CSC_LINK=$repackedPfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "WIN_CSC_KEY_PASSWORD=$repackedPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - name: Build electron package
              run: yarn release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
                  DISCORD_PUB_KEY: ${{ secrets.DISCORD_PUB_KEY }}
